name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0-beta.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundles:
    name: Build bridge and web bundles
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must start with v: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            app/package-lock.json

      - name: Build the bridge
        run: |
          set -euo pipefail
          npm --prefix bridge ci --no-audit --no-fund
          npm --prefix bridge run build
          npm --prefix bridge prune --omit=dev

      - name: Build the web app
        run: |
          set -euo pipefail
          npm --prefix app ci --no-audit --no-fund
          npm --prefix app run web:export

      - name: Package assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist release/bridge
          cp bridge/package.json bridge/package-lock.json bridge/.env.example release/bridge/
          cp -a bridge/dist bridge/node_modules release/bridge/
          tar -czf "dist/opencode-mobile-bridge-${VERSION}.tar.gz" -C release/bridge .
          (cd release/bridge && zip -qr "../../dist/opencode-mobile-bridge-${VERSION}.zip" .)
          tar -czf "dist/opencode-mobile-web-${VERSION}.tar.gz" -C app/dist .
          (cd app/dist && zip -qr "../../dist/opencode-mobile-web-${VERSION}.zip" .)
          (cd dist && sha256sum opencode-mobile-* > SHA256SUMS)
          ls -lh dist

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/*
          if-no-files-found: error

  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must start with v: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm --prefix app ci --no-audit --no-fund

      - name: Generate native project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          : > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-android-signing.cjs
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify and name APK
        id: artifact
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_KEY_CERT_SHA256 }}
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          CERT_DN="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate DN: //p' | head -1)"
          if printf '%s' "$CERT_DN" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK is debug-signed; refusing to publish it as a release."
            exit 1
          fi
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signer $ACTUAL_CERT_SHA256 does not match expected release certificate."
            exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::ANDROID_KEY_CERT_SHA256 is not set; pinned release-certificate verification was skipped."
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion):"
          VERSION="$(node -p "require('./app/app.json').expo.version")"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match app.json version ($VERSION)."
            exit 1
          fi
          NAME="opencode-mobile-${VERSION}.apk"
          mkdir -p dist-apk
          cp "$APK" "dist-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          (cd dist-apk && sha256sum "$NAME" > "$NAME.sha256")

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    name: Publish GitHub release
    needs: [bundles, apk]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Resolve tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Regenerate checksums
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum opencode-mobile-* > SHA256SUMS)
          echo "Generated SHA256SUMS:"
          cat dist/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            if [[ "$TAG" == *-* ]]; then
              gh release create "$TAG" dist/* \
                --title "OpenCode Mobile $TAG" \
                --generate-notes \
                --verify-tag \
                --prerelease
            else
              gh release create "$TAG" dist/* \
                --title "OpenCode Mobile $TAG" \
                --generate-notes \
                --verify-tag
            fi
          fi

      - name: Summary
        run: |
          {
            echo "### Release assets"
            echo
            echo "The release is published with all assets and SHA-256 checksums:"
            echo "- Bridge bundles (\`.tar.gz\`, \`.zip\`)"
            echo "- Web bundles (\`.tar.gz\`, \`.zip\`)"
            echo "- Android APK (\`.apk\`, \`.apk.sha256\`)"
            echo "- \`SHA256SUMS\`"
          } >> "$GITHUB_STEP_SUMMARY"
