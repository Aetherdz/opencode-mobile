name: Android release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach the verified APK to the release for this ref (run after bridge/web bundles publish).
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build release-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm --prefix app ci --no-audit --no-fund

      - name: Generate native project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          : > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-android-signing.cjs
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify and name APK
        id: artifact
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_KEY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          CERT_DN="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate DN: //p' | head -1)"
          if printf '%s' "$CERT_DN" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK is debug-signed; refusing to publish it as a release."
            exit 1
          fi
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signer $ACTUAL_CERT_SHA256 does not match expected release certificate."
            exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::ANDROID_KEY_CERT_SHA256 is not set; pinned release-certificate verification was skipped."
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion):"
          VERSION="$(node -p "require('./app/app.json').expo.version")"
          NAME="opencode-mobile-${VERSION}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" | tee "$NAME.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK and checksums to GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Dispatch this workflow on a version tag before attaching a release asset."
            exit 1
          fi
          VERSION="${TAG#v}"
          EXPECTED="opencode-mobile-${VERSION}.apk"
          if [ "$APK_NAME" != "$EXPECTED" ]; then
            echo "::error::APK filename does not match the checked-out version and commit."
            exit 1
          fi
          if [ "$(node -p "require('./app/app.json').expo.version")" != "$VERSION" ]; then
            echo "::error::Release tag does not match app.json version."
            exit 1
          fi
          gh release view "$TAG" >/dev/null
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release-assets"
          SUMS="$RUNNER_TEMP/release-assets/SHA256SUMS"
          grep -vF "  $APK_NAME" "$SUMS" > "$SUMS.new" || true
          mv "$SUMS.new" "$SUMS"
          sha256sum "$APK_NAME" "$APK_NAME.sha256" >> "$SUMS"
          gh release upload "$TAG" "$APK_NAME" "$APK_NAME.sha256" "$SUMS" --clobber

      - name: Summary
        run: |
          {
            echo "### Release-signed APK"
            echo
            echo "Artifact: \`${{ steps.artifact.outputs.name }}\`"
            echo
            echo "Signed with the project release key stored in repository secrets."
            echo "The artifact is also attached to the GitHub release when publish_release was selected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
